<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eCW Implementation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--ink:#14212b;--muted:#5b6b78;--line:#dfe5ea;--soft:#eef2f5;
  --brand:#0f4c5c;--brand-2:#13798c;--accent:#e8f3f5;
  --ok:#1e7a4c;--ok-bg:#e5f4ec;--warn:#9a5b00;--warn-bg:#fdf1dc;--bad:#b42318;--bad-bg:#fde8e6;--info:#2456a6;--info-bg:#e6eefb;--na:#5b6b78;--na-bg:#eef1f4;
  --r:10px;--shadow:0 1px 2px rgba(16,32,48,.06),0 2px 8px rgba(16,32,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
header.top h1{font-size:16px;font-weight:600;margin:0;flex:1;min-width:200px}
header.top h1 small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
.sync{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.err{background:#fde8e6;color:var(--bad)}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.22)}
.banner{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid #f3d9a8;font-size:13px}
.banner .wrap{padding-top:8px;padding-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi input[type=date]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13px;margin-top:4px;max-width:100%}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--brand-2);border-radius:99px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand);font-weight:600}
nav.tabs .count{font-size:11px;background:var(--soft);border-radius:99px;padding:1px 7px;margin-left:4px}
main{padding:18px 0 60px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.ws-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 54px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--soft);cursor:pointer}
.ws-row:first-of-type{border-top:0}
.ws-row:hover .ws-name{color:var(--brand-2)}
.ws-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-name small{color:var(--bad);font-weight:600;margin-left:6px}
.ws-row .bar{margin:0}
.ws-row .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--soft);align-items:flex-start}
.li:first-child{border-top:0}
.li .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:56px;padding-top:1px}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:600}
.li .t .n{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--na-bg);color:var(--na)}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-bad{background:var(--bad-bg);color:var(--bad)}.s-info{background:var(--info-bg);color:var(--info)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input[type=search]{flex:2;min-width:180px}
.toolbar select{max-width:230px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#b9c6cf}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0c3e4b}
.btn.danger{color:var(--bad)}
.spacer{flex:1}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--soft);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;border-top:0;background:#fafbfc;position:sticky;top:0}
tr.grp td{background:var(--accent);font-weight:600;color:var(--brand);border-top:1px solid var(--line)}
tr.grp td .gp{font-weight:500;color:var(--muted);margin-left:8px;font-size:12.5px}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:#fafcfd}
td.notes{color:var(--muted);font-size:13px;max-width:380px}
td.date{white-space:nowrap;font-variant-numeric:tabular-nums}
td.date.overdue{color:var(--bad);font-weight:600}
select.st{border:0;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,30,40,.45)}
dialog form{padding:20px}
dialog h3{margin:0 0 14px;font-size:16px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;gap:8px;margin-top:6px}
.callout{background:var(--info-bg);color:#1b3f78;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.log td{font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14212b;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:520px){.fld2{grid-template-columns:1fr}.kpi .val{font-size:22px}.ws-row{grid-template-columns:minmax(0,1fr) 70px 44px}}
@media print{header.top .tbtn,nav.tabs,.toolbar,.banner{display:none}body{background:#fff}.card,.tablewrap,.kpi{box-shadow:none}}
</style>
</head>

<script>
"use strict";
const SEED = JSON.parse(document.getElementById("seed").textContent);
const API = "/api/plan";
const LS = { name:"ecwt.name", key:"ecwt.key", local:"ecwt.localPlan", tab:"ecwt.tab", filt:"ecwt.filters" };
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

/* ---------- schema ---------- */
const STATUS = {
  tasks:["Pending","In progress","Blocked","Complete","N/A"],
  actions:["Open","In progress","Done"],
  milestones:["Not started","In progress","At risk","Done"],
  training:["Not scheduled","Scheduled","Completed"]
};
const TONE = {"Complete":"s-ok","Done":"s-ok","Completed":"s-ok","In progress":"s-info","Scheduled":"s-info","Blocked":"s-bad","At risk":"s-bad","Pending":"s-warn","Open":"s-warn","Not scheduled":"s-warn","Not started":"","N/A":""};
const DONE = new Set(["Complete","Done","Completed","N/A"]);
const COLL = {
  tasks:{label:"Task",title:"name",fields:[
    {k:"ws",l:"Workstream",t:"list"},{k:"name",l:"Task",t:"text",req:1},
    {k:"status",l:"Status",t:"status",half:1},{k:"owner",l:"Owner / resource",t:"text",half:1},
    {k:"start",l:"Start",t:"date",half:1},{k:"finish",l:"Finish",t:"date",half:1},
    {k:"duration",l:"Duration",t:"text"},{k:"notes",l:"Notes",t:"area"}]},
  actions:{label:"Action item",title:"item",fields:[
    {k:"item",l:"Action item",t:"text",req:1},{k:"status",l:"Status",t:"status",half:1},{k:"owner",l:"Owner",t:"text",half:1},
    {k:"due",l:"Due date",t:"date",half:1},{k:"notes",l:"Notes",t:"area"}]},
  milestones:{label:"Milestone",title:"name",fields:[
    {k:"name",l:"Milestone",t:"text",req:1},{k:"date",l:"Target date",t:"date",half:1},{k:"status",l:"Status",t:"status",half:1},
    {k:"owner",l:"Owner",t:"text"},{k:"notes",l:"Notes",t:"area"}]},
  training:{label:"Training session",title:"session",fields:[
    {k:"session",l:"Session",t:"text",req:1},{k:"audience",l:"Audience",t:"text"},
    {k:"date",l:"Date",t:"date",half:1},{k:"status",l:"Status",t:"status",half:1},
    {k:"trainer",l:"Trainer",t:"text",half:1},{k:"attendees",l:"Attendees / headcount",t:"text",half:1},{k:"notes",l:"Notes",t:"area"}]},
  contacts:{label:"Contact",title:"name",fields:[
    {k:"role",l:"Role",t:"text",req:1},{k:"name",l:"Name",t:"text"},{k:"email",l:"Email",t:"text",half:1},{k:"phone",l:"Phone",t:"text",half:1},{k:"notes",l:"Notes",t:"area"}]}
};

/* ---------- state ---------- */
let plan = null, version = 0, log = [], mode = "loading", editKeyRequired = false;
let pending = [];           // ops not yet saved
let saving = false, saveTimer = null;
let tab = ls.get(LS.tab) || "overview";
let filters = (()=>{ try{ return JSON.parse(ls.get(LS.filt)) || {}; }catch{ return {}; } })();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmt = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year: y!==new Date().getFullYear()?"numeric":undefined}); };
const daysUntil = iso => { if(!iso) return null; const [y,m,d]=iso.split("-").map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/864e5); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }

/* ---------- ops (so concurrent edits merge instead of overwrite) ---------- */
function applyOp(data, op){
  if(op.type==="set"){ const r=data[op.coll]?.find(x=>x.id===op.id); if(r) r[op.field]=op.value; }
  else if(op.type==="add"){ if(!data[op.coll].some(x=>x.id===op.row.id)) data[op.coll].push(clone(op.row)); }
  else if(op.type==="del"){ data[op.coll]=data[op.coll].filter(x=>x.id!==op.id); }
  else if(op.type==="meta"){ data[op.field]=op.value; }
  else if(op.type==="replace"){ Object.keys(data).forEach(k=>delete data[k]); Object.assign(data, clone(op.data)); }
}
function describe(op){
  const name = r => r ? (r[COLL[op.coll]?.title] || r.id) : op.id;
  if(op.type==="set"){ const f=COLL[op.coll].fields.find(f=>f.k===op.field); return `${COLL[op.coll].label} “${op.label}”: ${f?f.l:op.field} → ${op.value===""?"(blank)":op.value}`; }
  if(op.type==="add") return `Added ${COLL[op.coll].label.toLowerCase()} “${name(op.row)}”`;
  if(op.type==="del") return `Deleted ${COLL[op.coll].label.toLowerCase()} “${op.label}”`;
  if(op.type==="meta") return `Go-live date → ${op.value}`;
  if(op.type==="replace") return "Imported a full plan backup";
  return "Edit";
}
function commit(ops){
  ops = Array.isArray(ops) ? ops : [ops];
  if(!ops.length) return;
  if(!ensureName(()=>commit(ops))) { render(); return; }
  ops.forEach(op=>{ applyOp(plan, op); op.desc = describe(op); pending.push(op); });
  render();
  scheduleSave();
}

/* ---------- sync ---------- */
function setSync(text, err){ const s=$("#sync"); s.textContent=text; s.classList.toggle("err",!!err); }
async function load(){
  try{
    const r = await fetch(API, {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const doc = await r.json();
    editKeyRequired = !!doc.editKeyRequired;
    mode = "shared";
    if(!doc.data){ // first run: initialise shared copy from the plan
      plan = clone(SEED); version = doc.version || 0; log = doc.log || [];
      pending.push({type:"replace", data:clone(SEED), desc:"Loaded the implementation plan (initial setup)"});
      render(); setSync("Setting up…");
      if(!editKeyRequired || ls.get(LS.key)) scheduleSave(0);
      else { setSync("Not saved yet"); showBanner("First-time setup: make any edit and enter the edit passcode to save this plan for everyone."); }
      return;
    }
    plan = doc.data; version = doc.version; log = doc.log || [];
    setSync("All changes saved");
  }catch(e){
    mode = "local";
    let saved=null; try{ saved=JSON.parse(ls.get(LS.local)); }catch{}
    plan = saved || clone(SEED);
    showBanner("Preview mode — the shared database isn’t reachable here, so changes are saved only in this browser. Once deployed on Netlify, everyone shares one plan.");
    setSync("Saved in this browser");
  }
  render();
}
function showBanner(t){ $("#bannerText").textContent=t; $("#banner").hidden=false; }

function scheduleSave(delay=700){ clearTimeout(saveTimer); saveTimer=setTimeout(save, delay); setSync("Saving…"); }
async function save(){
  if(!pending.length) return;
  if(mode==="local"){ ls.set(LS.local, JSON.stringify(plan)); log = [...pending.map(o=>({at:new Date().toISOString(),by:ls.get(LS.name)||"Me",what:o.desc}))].reverse().concat(log).slice(0,500); pending=[]; setSync("Saved in this browser"); if(tab==="activity") render(); return; }
  if(saving){ scheduleSave(); return; }
  if(editKeyRequired && !ls.get(LS.key)){ askKey(); return; }
  saving = true;
  const batch = pending.slice();
  let retry = false;
  try{
    const r = await fetch(API, {method:"PUT", headers:{"content-type":"application/json","x-edit-key":ls.get(LS.key)||""},
      body: JSON.stringify({data:plan, baseVersion:version, editor: ls.get(LS.name)||"Unknown", changes: batch.map(o=>o.desc)})});
    const doc = await r.json().catch(()=>({}));
    if(r.status===409){ // someone else saved first: replay my edits on top of theirs
      const fresh = doc.data ? clone(doc.data) : clone(SEED);
      pending.forEach(op=>applyOp(fresh, op));
      plan = fresh; version = doc.version; log = doc.log||[];
      render(); retry = true; return;
    }
    if(r.status===401){ ls.del(LS.key); saving=false; setSync("Passcode needed", true); askKey(doc.error); return; }
    if(!r.ok) throw new Error(doc.error || r.status);
    version = doc.version; log = doc.log||[];
    pending = pending.slice(batch.length);
    $("#banner").hidden = true;
    setSync(pending.length ? "Saving…" : "All changes saved");
    if(tab==="activity") render();
  }catch(e){
    setSync("Not saved — retrying", true);
    saveTimer = setTimeout(save, 5000);
  }finally{ saving=false; if(retry) setTimeout(save, 0); }
}
async function poll(){
  if(mode!=="shared" || pending.length || saving || document.hidden || $("#dlg").open) return;
  try{
    const r = await fetch(API,{cache:"no-store"}); if(!r.ok) return;
    const doc = await r.json();
    if(doc.data && doc.version!==version){ plan=doc.data; version=doc.version; log=doc.log||[]; render(); toast("Updated with the latest changes from your team"); }
  }catch{}
}
setInterval(poll, 20000);
document.addEventListener("visibilitychange", poll);
window.addEventListener("beforeunload", e=>{ if(pending.length && mode==="shared"){ e.preventDefault(); e.returnValue=""; } });

/* ---------- name & passcode ---------- */
function ensureName(then){
  const needName=!ls.get(LS.name), needKey=editKeyRequired && mode==="shared" && !ls.get(LS.key);
  if(!needName && !needKey) return true;
  openDialog(`<h3>${needName?"Who’s making changes?":"Edit passcode"}</h3><p style="margin:0 0 12px;color:var(--muted)">${needName?"Your name appears in the activity log next to your updates.":""}${needKey?" Your administrator set a passcode for editing; enter it once on this device.":""}</p>
    ${needName?`<div class="fld"><label for="nm">Your name</label><input id="nm" required autocomplete="name"></div>`:""}
    ${needKey?`<div class="fld"><label for="pk">Edit passcode</label><input id="pk" type="password" required></div>`:""}
    <div class="dlg-actions"><span class="spacer"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Continue</button></div>`,
    f=>{ const nm=f.querySelector("#nm"), pk=f.querySelector("#pk");
      if(nm){ const v=nm.value.trim(); if(!v) return false; ls.set(LS.name,v); }
      if(pk){ if(!pk.value) return false; ls.set(LS.key,pk.value); }
      updateWho(); then&&setTimeout(then); }, ()=>render());
  return false;
}
function askKey(msg){
  openDialog(`<h3>Edit passcode</h3>${msg?`<div class="callout">${esc(msg)}</div>`:""}<p style="margin:0 0 12px;color:var(--muted)">Your administrator set a passcode for editing. Enter it once on this device.</p>
    <div class="fld"><label for="pk">Passcode</label><input id="pk" type="password" required></div>
    <div class="dlg-actions"><span class="spacer"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div>`,
    f=>{ const v=f.querySelector("#pk").value; if(!v) return false; ls.set(LS.key,v); scheduleSave(0); },
    ()=>setSync(pending.length?"Not saved — passcode needed":"All changes saved", !!pending.length));
}
function updateWho(){ $("#whoBtn").textContent = ls.get(LS.name) ? "👤 " + ls.get(LS.name) : "Set your name"; }
$("#whoBtn").onclick = ()=>{ ls.del(LS.name); ensureName(); };

/* ---------- dialog ---------- */
function openDialog(html, onOk, onCancel){
  const d=$("#dlg"), f=$("#dlgForm"); if(d.open) d.close(); f.innerHTML=html;
  f.onsubmit = e => { const v=e.submitter?.value; if(v==="ok"){ if(onOk(f)===false){ e.preventDefault(); return; } } else if(v==="delete"){ return; } else onCancel&&onCancel(); };
  d.onclose = null; d.showModal(); setTimeout(()=>f.querySelector("input,select,textarea")?.focus(),30);
}
function editRow(coll, id, preset){
  const isNew = !id; const def = COLL[coll];
  const row = isNew ? {id:uid(coll[0]), ...preset} : plan[coll].find(r=>r.id===id);
  if(!row) return;
  const wsList = [...new Set(plan.tasks.map(t=>t.ws))];
  const field = f => {
    const v = row[f.k] ?? "";
    let inp;
    if(f.t==="status") inp = `<select id="f_${f.k}">${STATUS[coll].map(s=>`<option ${s===v?"selected":""}>${esc(s)}</option>`).join("")}</select>`;
    else if(f.t==="area") inp = `<textarea id="f_${f.k}">${esc(v)}</textarea>`;
    else if(f.t==="date") inp = `<input type="date" id="f_${f.k}" value="${esc(v)}">`;
    else if(f.t==="list") inp = `<input id="f_${f.k}" list="wsl" value="${esc(v)}"><datalist id="wsl">${wsList.map(w=>`<option value="${esc(w)}">`).join("")}</datalist>`;
    else inp = `<input id="f_${f.k}" value="${esc(v)}" ${f.req?"required":""}>`;
    return `<div class="fld"><label for="f_${f.k}">${esc(f.l)}</label>${inp}</div>`;
  };
  let body="", buf=[];
  def.fields.forEach(f=>{ if(f.half){ buf.push(field(f)); if(buf.length===2){ body+=`<div class="fld2">${buf.join("")}</div>`; buf=[]; } } else { if(buf.length){ body+=`<div class="fld2">${buf.join("")}</div>`; buf=[]; } body+=field(f); } });
  if(buf.length) body+=`<div class="fld2">${buf.join("")}</div>`;
  openDialog(`<h3>${isNew?"Add":"Edit"} ${def.label.toLowerCase()}</h3>${body}
    <div class="dlg-actions">${isNew?"":`<button class="btn danger" value="delete" id="delBtn" formnovalidate>Delete</button>`}<span class="spacer"></span>
    <button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${isNew?"Add":"Save"}</button></div>`,
    f=>{
      const vals={}; def.fields.forEach(x=>vals[x.k]=f.querySelector("#f_"+x.k).value.trim());
      if(isNew){ setTimeout(()=>commit({type:"add",coll,row:{...row,...vals}})); return; }
      const ops=def.fields.filter(x=>(row[x.k]??"")!==vals[x.k]).map(x=>({type:"set",coll,id,field:x.k,value:vals[x.k],label:row[def.title]||vals[def.title]}));
      setTimeout(()=>commit(ops));
    });
  const del=$("#delBtn"); if(del) del.onclick=()=>{ if(confirm(`Delete this ${def.label.toLowerCase()}?`)) setTimeout(()=>commit({type:"del",coll,id,label:row[def.title]})); };
}

/* ---------- metrics ---------- */
const isOverdue = (date,status) => date && !DONE.has(status) && date < todayISO();
function wsStats(){
  const m = new Map();
  plan.tasks.forEach(t=>{ const s=m.get(t.ws)||{ws:t.ws,total:0,done:0,blocked:0,overdue:0}; s.total++; if(DONE.has(t.status)) s.done++; if(t.status==="Blocked") s.blocked++; if(isOverdue(t.finish,t.status)) s.overdue++; m.set(t.ws,s); });
  return [...m.values()];
}

/* ---------- render ---------- */
function pill(s){ return `<span class="pill ${TONE[s]||""}">${esc(s)}</span>`; }
function stSelect(coll,id,v){ return `<select class="st pill ${TONE[v]||""}" data-coll="${coll}" data-id="${id}" aria-label="Status">${STATUS[coll].map(s=>`<option ${s===v?"selected":""}>${esc(s)}</option>`).join("")}</select>`; }

function renderKPIs(){
  const t=plan.tasks, done=t.filter(x=>DONE.has(x.status)).length, pct=t.length?Math.round(done/t.length*100):0;
  const blocked=t.filter(x=>x.status==="Blocked").length;
  const openA=plan.actions.filter(a=>!DONE.has(a.status)).length;
  const dl=daysUntil(plan.goLive);
  const trDone=plan.training.filter(x=>x.status==="Completed").length, trSched=plan.training.filter(x=>x.status!=="Not scheduled").length;
  $("#kpis").innerHTML = `
   <div class="kpi"><div class="lbl">Target go-live</div><div class="val">${dl===null?"—":dl<0?"Passed":dl+" days"}</div>
     <input type="date" id="goLive" value="${esc(plan.goLive)}" aria-label="Target go-live date"></div>
   <div class="kpi"><div class="lbl">Tasks complete</div><div class="val">${pct}%</div><div class="sub">${done} of ${t.length}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div class="kpi"><div class="lbl">Blocked tasks</div><div class="val" style="color:${blocked?"var(--bad)":"inherit"}">${blocked}</div><div class="sub">waiting on a decision or document</div></div>
   <div class="kpi"><div class="lbl">Open action items</div><div class="val" style="color:${openA?"var(--warn)":"inherit"}">${openA}</div><div class="sub">of ${plan.actions.length}</div></div>
   <div class="kpi"><div class="lbl">Training</div><div class="val">${trSched}/${plan.training.length}</div><div class="sub">scheduled · ${trDone} completed</div></div>`;
  $("#goLive").onchange = e => commit({type:"meta",field:"goLive",value:e.target.value});
}

const TABS = [["overview","Overview"],["tasks","Project plan"],["actions","Action items"],["milestones","Road to go-live"],["training","Training"],["contacts","Contacts"],["activity","Activity"]];
function renderTabs(){
  const cnt = {tasks:plan.tasks.filter(t=>!DONE.has(t.status)).length, actions:plan.actions.filter(a=>!DONE.has(a.status)).length};
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}${cnt[k]?`<span class="count">${cnt[k]}</span>`:""}</button>`).join("");
}

function vOverview(){
  const ws = wsStats();
  const today=todayISO();
  const upcoming = plan.milestones.filter(m=>!DONE.has(m.status)).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")).slice(0,6);
  const blockers = plan.tasks.filter(t=>t.status==="Blocked");
  const openA = plan.actions.filter(a=>!DONE.has(a.status));
  const overdue = [...plan.tasks.filter(t=>isOverdue(t.finish,t.status)).map(t=>({t:t.name,ws:t.ws,d:t.finish,coll:"tasks",id:t.id})),
                   ...plan.milestones.filter(m=>isOverdue(m.date,m.status)).map(m=>({t:m.name,ws:"Road to go-live",d:m.date,coll:"milestones",id:m.id})),
                   ...plan.actions.filter(a=>isOverdue(a.due,a.status)).map(a=>({t:a.item,ws:"Action item",d:a.due,coll:"actions",id:a.id}))].sort((a,b)=>a.d.localeCompare(b.d));
  return `<div class="grid2">
   <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <div class="card"><h2>Workstreams <span class="hint">click one to open its tasks</span></h2>
     ${ws.map(s=>{const p=Math.round(s.done/s.total*100);return `<div class="ws-row" data-ws="${esc(s.ws)}"><div class="ws-name">${esc(s.ws)}${s.blocked?`<small>${s.blocked} blocked</small>`:""}${s.overdue?`<small>${s.overdue} overdue</small>`:""}</div><div class="bar"><i style="width:${p}%;background:${p===100?"var(--ok)":"var(--brand-2)"}"></i></div><div class="pct">${s.done}/${s.total}</div></div>`;}).join("")}
    </div>
    <div class="card"><h2>Overdue <span class="hint">past their date and not done</span></h2>
     ${overdue.length?`<div class="list">${overdue.map(o=>`<div class="li"><div class="d" style="color:var(--bad)">${fmt(o.d)}</div><div class="t"><b>${esc(o.t)}</b><div class="n">${esc(o.ws)}</div></div><button class="btn" data-edit="${o.coll}:${o.id}">Update</button></div>`).join("")}</div>`:`<div class="empty">Nothing overdue.</div>`}
    </div>
   </div>
   <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <div class="card"><h2>Next milestones</h2>
     ${upcoming.length?`<div class="list">${upcoming.map(m=>`<div class="li"><div class="d"${isOverdue(m.date,m.status)?' style="color:var(--bad)"':""}>${fmt(m.date)}</div><div class="t"><b>${esc(m.name)}</b><div class="n">${esc(m.owner)}</div></div>${pill(m.status)}</div>`).join("")}</div>`:`<div class="empty">All milestones done.</div>`}
    </div>
    <div class="card"><h2>Blocked</h2>
     ${blockers.length?`<div class="list">${blockers.map(t=>`<div class="li"><div class="t"><b>${esc(t.name)}</b><div class="n">${esc(t.ws)}${t.notes?" — "+esc(t.notes):""}</div></div><button class="btn" data-edit="tasks:${t.id}">Update</button></div>`).join("")}</div>`:`<div class="empty">Nothing blocked.</div>`}
    </div>
    <div class="card"><h2>Open action items</h2>
     ${openA.length?`<div class="list">${openA.map(a=>`<div class="li"><div class="t"><b>${esc(a.item)}</b><div class="n">${esc(a.owner)}${a.due?" · due "+fmt(a.due):""}</div></div>${stSelect("actions",a.id,a.status)}</div>`).join("")}</div>`:`<div class="empty">No open action items.</div>`}
    </div>
   </div></div>`;
}

function vTasks(){
  const wsAll=[...new Set(plan.tasks.map(t=>t.ws))];
  const owners=[...new Set(plan.tasks.map(t=>t.owner).filter(Boolean))].sort();
  const q=(filters.q||"").toLowerCase();
  const rows=plan.tasks.filter(t=>(!filters.ws||t.ws===filters.ws)&&(!filters.st||(filters.st==="open"?!DONE.has(t.status):t.status===filters.st))&&(!filters.ow||t.owner===filters.ow)&&(!q||[t.name,t.notes,t.owner,t.ws].join(" ").toLowerCase().includes(q)));
  const groups=wsAll.map(w=>[w,rows.filter(r=>r.ws===w)]).filter(g=>g[1].length);
  return `<div class="toolbar">
    <input type="search" id="fq" placeholder="Search tasks, notes, owners" value="${esc(filters.q||"")}">
    <select id="fws"><option value="">All workstreams</option>${wsAll.map(w=>`<option ${filters.ws===w?"selected":""}>${esc(w)}</option>`).join("")}</select>
    <select id="fst"><option value="">All statuses</option><option value="open" ${filters.st==="open"?"selected":""}>Not done</option>${STATUS.tasks.map(s=>`<option ${filters.st===s?"selected":""}>${s}</option>`).join("")}</select>
    <select id="fow"><option value="">All owners</option>${owners.map(o=>`<option ${filters.ow===o?"selected":""}>${esc(o)}</option>`).join("")}</select>
    <span class="spacer"></span><button class="btn" data-csv="tasks">Download CSV</button><button class="btn primary" data-add="tasks">+ Add task</button></div>
   <div class="tablewrap"><table><thead><tr><th style="width:34%">Task</th><th>Status</th><th>Start</th><th>Finish</th><th>Owner</th><th>Notes</th></tr></thead><tbody>
   ${groups.length?groups.map(([w,rs])=>{const all=plan.tasks.filter(t=>t.ws===w),d=all.filter(t=>DONE.has(t.status)).length;return `<tr class="grp"><td colspan="6">${esc(w)}<span class="gp">${d}/${all.length} done</span></td></tr>`+rs.map(t=>`<tr class="row" data-edit="tasks:${t.id}"><td>${esc(t.name)}${t.duration?`<div class="n" style="color:var(--muted);font-size:12px">${esc(t.duration)}</div>`:""}</td><td>${stSelect("tasks",t.id,t.status)}</td><td class="date">${t.start?fmt(t.start):'<span style="color:var(--muted)">TBD</span>'}</td><td class="date ${isOverdue(t.finish,t.status)?"overdue":""}">${t.finish?fmt(t.finish):'<span style="color:var(--muted)">TBD</span>'}</td><td>${esc(t.owner)}</td><td class="notes">${esc(t.notes)}</td></tr>`).join("");}).join(""):`<tr><td colspan="6" class="empty">No tasks match these filters.</td></tr>`}
   </tbody></table></div>`;
}

function vSimple(coll, cols, opts={}){
  const rows = opts.sort ? plan[coll].slice().sort(opts.sort) : plan[coll];
  return `${opts.intro||""}<div class="toolbar"><span class="spacer"></span><button class="btn" data-csv="${coll}">Download CSV</button><button class="btn primary" data-add="${coll}">+ Add ${COLL[coll].label.toLowerCase()}</button></div>
   <div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
   ${rows.length?rows.map(r=>`<tr class="row" data-edit="${coll}:${r.id}">${cols.map(([k])=>{const v=r[k]??"";
     if(k==="status") return `<td>${stSelect(coll,r.id,v)}</td>`;
     if(["date","due"].includes(k)) return `<td class="date ${isOverdue(v,r.status)?"overdue":""}">${v?fmt(v):'<span style="color:var(--muted)">—</span>'}</td>`;
     if(k==="notes") return `<td class="notes">${esc(v)}</td>`;
     if(k==="email") return `<td>${v?`<a href="mailto:${esc(v)}" onclick="event.stopPropagation()">${esc(v)}</a>`:""}</td>`;
     if(k==="phone") return `<td style="white-space:nowrap">${v?`<a href="tel:${esc(v.replace(/[^\d+,]/g,""))}" onclick="event.stopPropagation()">${esc(v)}</a>`:""}</td>`;
     return `<td>${esc(v)}</td>`;}).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="empty">Nothing here yet.</td></tr>`}
   </tbody></table></div>`;
}

function vActivity(){
  return `<div class="tablewrap log"><table><thead><tr><th style="width:170px">When</th><th style="width:160px">Who</th><th>Change</th></tr></thead><tbody>
   ${log.length?log.map(e=>`<tr><td class="date">${esc(new Date(e.at).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))}</td><td>${esc(e.by)}</td><td>${esc(e.what)}</td></tr>`).join(""):`<tr><td colspan="3" class="empty">No changes recorded yet.</td></tr>`}
   </tbody></table></div>`;
}

function render(){
  if(!plan) return;
  renderKPIs(); renderTabs();
  const byDate=(a,b)=>(a.date||"9").localeCompare(b.date||"9");
  const v = {
    overview: vOverview,
    tasks: vTasks,
    actions: ()=>vSimple("actions",[["item","Action item"],["status","Status"],["owner","Owner"],["due","Due"],["notes","Notes"]]),
    milestones: ()=>vSimple("milestones",[["date","Target"],["name","Milestone"],["status","Status"],["owner","Owner"],["notes","Notes"]],{sort:byDate,intro:`<div class="callout">A working schedule counted back from the target go-live. These dates are proposals to confirm with the eCW project manager — edit them as dates are agreed.</div>`}),
    training: ()=>vSimple("training",[["session","Session"],["audience","Audience"],["date","Date"],["status","Status"],["trainer","Trainer"],["attendees","Attendees"],["notes","Notes"]],{sort:byDate,intro:`<div class="callout">Plan role-based training for the two weeks before go-live, with super users trained first. Add dates and headcounts as eCW confirms trainers.</div>`}),
    contacts: ()=>vSimple("contacts",[["role","Role"],["name","Name"],["email","Email"],["phone","Phone"],["notes","Notes"]]),
    activity: vActivity
  }[tab] || vOverview;
  $("#view").innerHTML = v();
  bindFilters();
}

/* ---------- events ---------- */
function bindFilters(){
  const set=(k,v)=>{ filters[k]=v; ls.set(LS.filt,JSON.stringify(filters)); render(); };
  const fq=$("#fq"); if(fq){ fq.oninput=e=>{ filters.q=e.target.value; ls.set(LS.filt,JSON.stringify(filters)); clearTimeout(fq._t); fq._t=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const n=$("#fq"); n.focus(); n.setSelectionRange(pos,pos); },200); }; }
  [["#fws","ws"],["#fst","st"],["#fow","ow"]].forEach(([s,k])=>{ const el=$(s); if(el) el.onchange=e=>set(k,e.target.value); });
}
document.addEventListener("click", e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){ tab=tb.dataset.tab; ls.set(LS.tab,tab); render(); return; }
  if(e.target.closest("select.st")) return;
  const wr=e.target.closest("[data-ws]"); if(wr){ filters={ws:wr.dataset.ws}; ls.set(LS.filt,JSON.stringify(filters)); tab="tasks"; ls.set(LS.tab,tab); render(); window.scrollTo({top:0}); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ const [c,id]=ed.dataset.edit.split(":"); editRow(c,id); return; }
  const ad=e.target.closest("[data-add]"); if(ad){ const c=ad.dataset.add; const preset={status:STATUS[c]?.[0]}; if(c==="tasks"&&filters.ws) preset.ws=filters.ws; editRow(c,null,preset); return; }
  const cv=e.target.closest("[data-csv]"); if(cv){ downloadCSV(cv.dataset.csv); return; }
});
document.addEventListener("change", e=>{
  const s=e.target.closest("select.st"); if(!s) return;
  const {coll,id}=s.dataset; const r=plan[coll].find(x=>x.id===id);
  if(r && r.status!==s.value) commit({type:"set",coll,id,field:"status",value:s.value,label:r[COLL[coll].title]});
});

/* ---------- export / import ---------- */
function dl(name, text, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function downloadCSV(coll){
  const f=COLL[coll].fields; const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  dl(`ecw-${coll}-${todayISO()}.csv`, [f.map(x=>q(x.l)).join(","), ...plan[coll].map(r=>f.map(x=>q(r[x.k])).join(","))].join("\r\n"), "text/csv");
}
$("#exportBtn").onclick=()=>dl(`ecw-plan-backup-${todayISO()}.json`, JSON.stringify(plan,null,1), "application/json");
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{ const d=JSON.parse(await file.text()); if(!Array.isArray(d.tasks)||!Array.isArray(d.actions)) throw 0;
    ["milestones","training","contacts"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
    if(confirm("Replace the whole plan with this backup? Everyone will see the imported version.")) commit({type:"replace",data:d});
  }catch{ toast("That file isn’t a tracker backup."); }
};

updateWho();
load();
</script>
</body>
</html>
